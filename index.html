<!doctype html><html lang="en"><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1">  <title>Comic Production Planner</title>  <link rel="stylesheet" href="styles.css"></head><body>  <main class="container">    <header class="page-header">      <p class="eyebrow">Independent publishing workspace</p>      <h1>Comic Production Planner</h1>      <p>Break a release into visible tasks without replacing your creative judgment.</p>    </header>
    <section class="panel" aria-labelledby="add-task-heading">      <h2 id="add-task-heading">Add a production task</h2>
      <form id="taskForm">        <div class="form-grid">          <div class="field field-wide">            <label for="taskName">Task name</label>            <input id="taskName" name="taskName" type="text"              placeholder="Example: Letter chapter two" maxlength="120" required>          </div>
          <div class="field">            <label for="taskType">Type</label>            <select id="taskType" name="taskType">              <option>Writing</option>              <option>Drawing</option>              <option>Lettering</option>              <option>Marketing</option>              <option>Admin</option>            </select>          </div>
          <div class="field">            <label for="taskDate">Due date</label>            <input id="taskDate" name="taskDate" type="date" required>          </div>
          <div class="field">            <label for="taskStatus">Status</label>            <select id="taskStatus" name="taskStatus">              <option>Planned</option>              <option>In progress</option>              <option>Complete</option>            </select>          </div>        </div>
        <button type="submit">Save task</button>        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>      </form>    </section>
    <section class="panel" aria-labelledby="task-list-heading">      <div class="section-heading">        <div>          <p class="eyebrow">Current release</p>          <h2 id="task-list-heading">Production tasks</h2>        </div>        <span id="taskCount" class="task-count">0 tasks</span>      </div>
      <p id="emptyState" class="empty-state">No tasks saved yet.</p>      <ul id="taskList" class="task-list"></ul>    </section>  </main>
  <script src="app.js"></script></body></html>
